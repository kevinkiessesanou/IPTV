<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Inter:wght@500;600;800;900&display=block" rel="stylesheet">
<style>
:root{--vert:#009E49;--action:#007A38;--jaune:#FACC15;--profond:#04331C;--para:#D7EEE0;--ment:#CFEBDA}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:var(--h);overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:var(--profond)}
.page{position:relative;width:1080px;height:var(--h);padding:var(--pt) 70px var(--pb);display:flex;flex-direction:column;
 background:radial-gradient(circle at 50% 55%,rgba(0,158,73,.55),rgba(4,51,28,0) 62%),var(--profond)}
.page:before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:40px 40px}
header{display:flex;justify-content:space-between;align-items:center;position:relative}
header img{height:64px}
.sur{display:flex;align-items:center;gap:14px;color:var(--jaune);font-weight:800;font-size:23px;letter-spacing:.2em}
.sur i{width:44px;height:6px;border-radius:3px;background:var(--jaune);display:block}
.top{position:relative;text-align:center;margin-top:calc(34px*var(--k))}
.acc{font-weight:600;font-size:calc(30px*var(--k));color:var(--para)}
h1{font-family:Sora,'Inter Display',sans-serif;font-weight:800;font-size:calc(104px*var(--k));line-height:1;letter-spacing:-.045em;margin-top:14px}
h1 em{font-style:normal;color:var(--jaune);white-space:nowrap}
.exp{font-weight:500;font-size:calc(30px*var(--k));line-height:1.4;color:var(--para);margin-top:16px}
.mapw{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#map{width:100%;height:100%;overflow:visible}
footer{display:flex;justify-content:space-between;align-items:center;position:relative}
.cta b{display:block;font-weight:900;font-size:calc(36px*var(--k))}
.cta span{font-weight:600;font-size:calc(25px*var(--k));color:var(--para)}
.badge{height:76px}
.ment{position:relative;text-align:center;font-weight:600;font-size:21px;color:var(--ment);margin-top:22px}
</style></head><body>
<div class="page">
<header><img src="../../logos/kibaa_logo_horizontal_fond_sombre.png" alt="KIBAA"><div class="sur"><i></i>NOUVEAU</div></header>
<div class="top">
 <div class="acc">Née au Burkina Faso, pour l'Afrique.</div>
 <h1>KIBAA relie <em>20 pays.</em></h1>
 <div class="exp">Discutez et vendez, d'un pays à l'autre.</div>
</div>
<div class="mapw"><svg id="map"></svg></div>
<footer><div class="cta"><b>Téléchargez KIBAA.</b><span>Gratuit. « Kibaa » — parlons.</span></div><img class="badge" src="../../badge-google-play.png" alt="Disponible sur Google Play"></footer>
<div class="ment">kibaa.online · Facebook @kibaa.online · TikTok @kibaa.app · YouTube @kibaa-app</div>
</div>
<script src="carte-dispo.js"></script>
<script>
const f=new URLSearchParams(location.search).get('f')==='916',r=document.documentElement.style;
r.setProperty('--h',f?'1920px':'1350px');r.setProperty('--k',f?'1.15':'1');r.setProperty('--pt',f?'250px':'70px');r.setProperty('--pb',f?'250px':'50px');
const {W,H,countries:C}=DISPO;
// Haïti : encart à l'ouest de la carte, relié au réseau
const HX=-150,HY=330;
const svg=document.getElementById('map');svg.setAttribute('viewBox',`-210 -10 ${W+230} ${H+20}`);
let s='<defs><filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/></filter></defs>';
// 1. pièces du puzzle (drapeaux)
s+='<g filter="url(#sh)">';
C.forEach((c,i)=>{const[x0,y0,x1,y1]=c.b;s+=`<clipPath id="cp${i}"><path d="${c.d}"/></clipPath><image href="flags/${c.flag}.svg" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" preserveAspectRatio="xMidYMid slice" clip-path="url(#cp${i})"/>`});
s+='</g>';
C.forEach(c=>{s+=`<path d="${c.d}" fill="none" stroke="${c.flag==='bf'?'#FACC15':'#FFFFFF'}" stroke-width="${c.flag==='bf'?5:2.5}" stroke-linejoin="round"/>`});
// encart Haïti (silhouette simplifiée en pièce drapeau)
s+=`<g transform="translate(${HX-60},${HY-45})"><rect x="-14" y="-14" width="148" height="118" rx="22" fill="rgba(255,255,255,.07)" stroke="rgba(255,255,255,.25)" stroke-width="2"/><clipPath id="cph"><rect x="0" y="0" width="120" height="90" rx="10"/></clipPath><image href="flags/ht.svg" x="0" y="0" width="120" height="90" preserveAspectRatio="xMidYMid slice" clip-path="url(#cph)"/><text x="60" y="132" text-anchor="middle" font-family="Inter" font-weight="700" font-size="24" fill="#CFEBDA">Haïti</text></g>`;
// 2. réseau : chaque pays relié au Burkina + à ses 2 voisins les plus proches
const pts=C.map(c=>({x:c.p[0],y:c.p[1],bf:c.flag==='bf'}));pts.push({x:HX,y:HY,ht:true});
const hub=pts.findIndex(p=>p.bf),E=new Set();
const key=(a,b)=>a<b?a+'-'+b:b+'-'+a;
pts.forEach((p,i)=>{if(i!==hub)E.add(key(i,hub));pts.map((q,j)=>[j,Math.hypot(p.x-q.x,p.y-q.y)]).filter(([j])=>j!==i).sort((a,b)=>a[1]-b[1]).slice(0,2).forEach(([j])=>E.add(key(i,j)))});
let lines='',dots='';
[...E].forEach(k=>{const[a,b]=k.split('-').map(Number),A=pts[a],B=pts[b],mx=(A.x+B.x)/2,my=(A.y+B.y)/2,dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),cx=mx-dy*.18,cy=my+dx*.18-L*.05;
 const toHub=a===hub||b===hub;
 lines+=`<path d="M${A.x} ${A.y-34}Q${cx} ${cy-34} ${B.x} ${B.y-34}" fill="none" stroke="${toHub?'rgba(255,255,255,.85)':'rgba(233,248,239,.5)'}" stroke-width="${toHub?3:2}" stroke-dasharray="${toHub?'':'2 9'}" stroke-linecap="round"/>`;
 const t=.5,qx=(1-t)*(1-t)*A.x+2*t*(1-t)*cx+t*t*B.x,qy=(1-t)*(1-t)*(A.y-34)+2*t*(1-t)*(cy-34)+t*t*(B.y-34);
 if(toHub)dots+=`<circle cx="${qx}" cy="${qy}" r="5" fill="#fff"/>`;});
s+=`<g>${lines}${dots}</g>`;
// 3. piquets KIBAA (symbole officiel dans une épingle blanche)
const pin=(x,y,big)=>{const R=big?36:26,h=big?92:68;return `<g transform="translate(${x},${y})" filter="url(#sh)"><ellipse cx="0" cy="2" rx="${R*.45}" ry="${R*.16}" fill="rgba(0,0,0,.35)"/>
 <path d="M0 0 C ${-R*.35} ${-h*.35} ${-R} ${-h+R*1.05} ${-R} ${-h+R} A ${R} ${R} 0 1 1 ${R} ${-h+R} C ${R} ${-h+R*1.05} ${R*.35} ${-h*.35} 0 0Z" fill="#fff" stroke="${big?'#FACC15':'#009E49'}" stroke-width="${big?5:3}"/>
 <image href="../../logos/kibaa_symbole_couleur.png" x="${-R*.72}" y="${-h+R*.28}" width="${R*1.44}" height="${R*1.44}"/></g>`};
pts.forEach(p=>{if(!p.bf)s+=pin(p.x,p.y,false)});const B=pts[hub];s+=pin(B.x,B.y,true);
svg.innerHTML=s;
</script></body></html>
